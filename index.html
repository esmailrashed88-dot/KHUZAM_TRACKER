<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>KHUZAM Delivery Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout (IBIMS tracker system): navy title-block band with view tabs, stat strip,
   "due now" log, module panels → building selector → level × element matrix (concrete | reinforcement). */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F5F8FA; --ink:#10263A; --muted:#566879; --line:#D2DCE4;
  --band:#0F2A44; --band-ink:#EAF2F8; --band-muted:#9DB4C8; --band-line:#294765;
  --accent:#0B7F82; --accent-ink:#FFFFFF; --accent-soft:#DDF1F0;
  --ok:#1B7446; --ok-soft:#DCF1E5; --warn:#8A5800; --warn-soft:#FBEDCF;
  --bad:#B3261E; --bad-soft:#FBE2DF; --info:#1D5FA8; --info-soft:#DEEBFA; --idle:#566879; --idle-soft:#E5EBF0;
  --c-done:#1B8A52; --c-late:#D03B3B;
  --shadow:0 1px 2px rgba(16,38,58,.06),0 6px 18px rgba(16,38,58,.06);
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1620; --surface:#11212E; --surface-2:#162A3A; --ink:#E4EDF4; --muted:#93A6B7; --line:#24394B;
  --band:#081A2B; --band-ink:#EAF2F8; --band-muted:#8FA8BE; --band-line:#1E3852;
  --accent:#35BDB8; --accent-ink:#06201F; --accent-soft:#123A3C;
  --ok:#5FCB92; --ok-soft:#143524; --warn:#E9B657; --warn-soft:#3A2C0E;
  --bad:#F28B82; --bad-soft:#40191A; --info:#7FB4F0; --info-soft:#15304D; --idle:#93A6B7; --idle-soft:#1D3040;
  --c-done:#2FA86A; --c-late:#E66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1620; --surface:#11212E; --surface-2:#162A3A; --ink:#E4EDF4; --muted:#93A6B7; --line:#24394B;
  --band:#081A2B; --band-ink:#EAF2F8; --band-muted:#8FA8BE; --band-line:#1E3852;
  --accent:#35BDB8; --accent-ink:#06201F; --accent-soft:#123A3C;
  --ok:#5FCB92; --ok-soft:#143524; --warn:#E9B657; --warn-soft:#3A2C0E;
  --bad:#F28B82; --bad-soft:#40191A; --info:#7FB4F0; --info-soft:#15304D; --idle:#93A6B7; --idle-soft:#1D3040;
  --c-done:#2FA86A; --c-late:#E66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.ar{display:block;font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-weight:500;font-size:max(11px,.72em);letter-spacing:0;text-transform:none;line-height:1.35;direction:rtl;unicode-bidi:isolate;opacity:.82}
.ar{text-align:left}
.r .ar,th.r .ar{text-align:right}
.pill .ar,.code .ar,.tag .ar,.btn .ar{text-align:center;opacity:.9}
.tag:has(.ar),.code:has(.ar){display:inline-flex;flex-direction:column;align-items:center;line-height:1.25;padding-block:2px}
.pill:has(.ar){border-radius:10px;text-align:center}

.btn .ar{font-size:11px}
.btn.bi{flex-direction:column;gap:0;line-height:1.15}
.views button .ar{font-size:12px;color:inherit}
.muted{color:var(--muted)}

/* band */
.band{background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--accent)}
.band-in{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
.brand b{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:.14em;line-height:1}
.brand .ar{font-size:14px;color:var(--band-muted);opacity:1}
.brand span{font-family:var(--font-display);font-weight:500;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted);padding-left:14px;border-left:1px solid var(--band-line)}
.views{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.views button{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--band-muted);padding:6px 12px;cursor:pointer;white-space:nowrap}
.views button:hover{color:var(--band-ink)}
.views button[aria-pressed="true"]{color:var(--band-ink);border-bottom-color:var(--accent)}
.views button.exec{border:1px solid var(--accent);border-radius:5px;color:var(--band-ink);margin-right:8px;padding:6px 14px}
.views button.exec[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.conn{font-size:12px;color:var(--band-muted);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--band-muted);display:inline-block}
.conn.live i{background:#3ED3A0} .conn.off i{background:#F2A65A}
.band-tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.asof{font-size:12px;color:var(--band-muted)}
@media (max-width:520px){.band-in{padding-inline:16px}.views button{font-size:15px;padding:5px 9px}.views button.exec{padding:5px 10px;margin-right:4px}}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:500;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:15px;height:15px}

.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
@media (max-width:520px){.wrap{padding-inline:16px}}

/* headings */
.mhead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.mhead h1,.mhead h2{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1.1}
.mhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
.sec-head h2{font-family:var(--font-display);font-weight:600;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted);font-size:13px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-weight:600;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:18px;color:var(--muted);margin-left:3px}
.stat small{color:var(--muted);font-size:12px}
.stat.alert b{color:var(--bad)} .stat.warnv b{color:var(--warn)} .stat.okv b{color:var(--ok)}
.stat .meter{margin-block:4px 2px}
@media (max-width:860px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:first-child{grid-column:1/-1}}
.meter{height:8px;background:var(--idle-soft);border-radius:4px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m-done{background:var(--c-done)} .meter .m-late{background:var(--c-late)}
.meter.big{height:12px;border-radius:6px}

/* pills, codes */
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap;background:var(--idle-soft);color:var(--idle)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.code{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.1em;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag{font-size:11.5px;font-weight:600;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--idle);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)} .dot.info{background:var(--info)}

/* due-now log */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
table.log{min-width:760px}
th{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.r,td.r{text-align:right}
td.nowrap{white-space:nowrap}
td .sub{display:block;font-size:12px;color:var(--muted)}
tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.daybreak td{border-top:2px solid var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:22px 16px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:62ch}

/* module panels */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:980px){.pgrid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:border-color .15s}
.panel:hover{border-color:var(--accent)}
.panel.nodata{box-shadow:none;border-style:dashed}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.proj-t{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:.05em;line-height:1.05;margin:0}
.bl-mini{display:flex;gap:5px}
.code.ref{border-style:dashed;color:var(--info)}
.refnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--info-soft);color:var(--info);border:1px solid var(--info);border-radius:8px;padding:10px 14px;font-weight:500;margin-bottom:10px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog-pct{font-family:var(--font-display);font-weight:600;font-size:30px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:8px}
.kpi{display:flex;flex-direction:column;min-width:0}
.kpi span{font-size:11.5px;color:var(--muted)}
.kpi b{font-family:var(--font-display);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.alert b{color:var(--bad)}
.nextline{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px}
.nextline .plabel{font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* building selector */
.seg{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.bgrid{grid-template-columns:1fr}}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;min-width:0}
.bcard:hover{border-color:var(--accent)}
.bcard[aria-pressed="true"]{border-color:var(--band);box-shadow:inset 0 -3px 0 var(--accent),var(--shadow)}
.bhead{display:flex;gap:12px;align-items:center}
.bletter{width:46px;height:46px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:28px;flex:none}
.bcard[aria-pressed="true"] .bletter{background:var(--band);border-color:var(--band);color:var(--band-ink)}
.bhead div{display:flex;flex-direction:column;min-width:0}
.bhead b{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.04em;line-height:1.1}
.bhead span{font-size:12px;color:var(--muted)}

/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fbar .seg button{font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:5px 14px;border-radius:5px;cursor:pointer;line-height:1.25}
.fbar .seg button:hover{border-color:var(--accent)}
.fbar .seg button[aria-pressed="true"]{background:var(--band);border-color:var(--band);color:var(--band-ink);box-shadow:inset 0 -3px 0 var(--accent)}
.fbar .seg button{display:inline-flex;align-items:center;gap:2px}.fbar .seg button .ar{font-size:12px}
.fbar .seg button small{font-family:var(--font-body);font-weight:500;font-size:12px;letter-spacing:0;opacity:.7;margin-left:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* matrix */
table.mx{min-width:720px;table-layout:fixed}
table.mx col.c-el{width:24%}
table.mx th small{display:block;font-family:var(--font-body);font-weight:500;letter-spacing:0;text-transform:none;font-size:11.5px}
tr.lvl td{background:var(--surface-2);padding:10px;border-top:2px solid var(--line)}
.lvl-in{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.lvl-in h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.08em;display:flex;gap:10px;align-items:center}
.lvl-meta{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.lvl-meta .meter{width:110px;height:6px}
td.el{font-weight:600;font-size:13.5px}
td.cellw{padding:4px}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cell:hover{border-color:var(--accent);background:var(--surface-2)}
.cell .l1,.cell .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cell .dt{font-weight:600;font-variant-numeric:tabular-nums}
.cell .l2{font-size:12px;color:var(--muted)}
.cell.late{background:var(--bad-soft)} .cell.late .cd{color:var(--bad);font-weight:600}
.cell.soon .cd{color:var(--warn);font-weight:600}
.cell.week .cd{color:var(--info);font-weight:600}
.cell.done .dt{text-decoration:line-through;text-decoration-color:var(--ok)} .cell.done .cd{color:var(--ok);font-weight:600}
.na{color:var(--muted);font-size:12.5px;padding:7px 9px;display:block}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(8,20,32,.55);display:grid;place-items:center;padding:16px;z-index:40}
.dlg{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg-h{background:var(--band);color:var(--band-ink);padding:12px 18px;border-bottom:3px solid var(--accent);display:flex;flex-direction:column;gap:2px}
.dlg-h small{font-family:var(--font-display);font-weight:600;letter-spacing:.1em;color:var(--band-muted);font-size:13px}
.dlg-h h3{font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0}
.dlg-b{padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.dlg-b .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;min-width:0;max-width:100%}
.field output{border:1px dashed var(--line);border-radius:6px;padding:7px 9px;background:var(--surface-2);min-height:36px;font-variant-numeric:tabular-nums}
.note{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px}
.dlg-f{padding:12px 18px 16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;border-top:1px solid var(--line)}
.dlg-f .left{margin-right:auto}
.err{color:var(--bad);font-size:13px;margin:0}
@media (max-width:520px){.dlg-b{grid-template-columns:1fr}}
@media (max-width:640px){
  .tablewrap table.mx{min-width:0;table-layout:auto}
  .tablewrap table.mx thead,.tablewrap table.mx colgroup{display:none}
  .tablewrap table.mx tbody,.tablewrap table.mx tr.lvl,.tablewrap table.mx tr.lvl td{display:block}
  .tablewrap table.mx tr:not(.lvl){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tablewrap table.mx td.el{grid-column:1/-1;border-bottom:0;padding-bottom:0}
  .tablewrap table.mx td.cellw+td.cellw{border-left:1px dashed var(--line)}
  .cell::before{content:attr(data-pk);font-family:var(--font-display);font-weight:600;font-size:12px;letter-spacing:.08em;color:var(--muted)}
}
/* clickable stat tiles */
button.stat{border:0;text-align:left;cursor:pointer;font:inherit;color:inherit;position:relative}
button.stat:hover{background:var(--surface-2)}
button.stat .go{position:absolute;top:12px;right:14px;font-size:12px;font-weight:600;color:var(--accent)}
/* due-today notification bar */
.nbar{background:var(--warn-soft);border-bottom:1px solid var(--warn);color:var(--ink)}
.nbar.lateonly{background:var(--bad-soft);border-bottom-color:var(--bad)}
.nb-in{max-width:1320px;margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;align-items:start}
@media (max-width:520px){.nb-in{padding-inline:16px;grid-template-columns:auto minmax(0,1fr)}.nb-act{grid-column:1/-1}}
.nb-ic{width:34px;height:34px;border-radius:8px;background:var(--warn);color:var(--surface);display:grid;place-items:center}
.nbar.lateonly .nb-ic{background:var(--bad)}
.nb-ic svg{width:18px;height:18px}
.nb-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.nb-t b{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.nbar.lateonly .nb-t b{color:var(--bad)}
.nb-t span{font-size:13px;color:var(--muted)}
.nb-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.nb-list li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.nb-list li .w{font-weight:600;margin-right:auto}
.nb-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.nb-x{border:0;background:none;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.nb-x:hover{background:var(--surface)}
.dlg.wide{width:min(1060px,100%)}
.dlg.wide .dlg-b{display:block}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:10px 16px;border-radius:8px;border:1px solid var(--band-line);box-shadow:var(--shadow);max-width:calc(100vw - 32px);z-index:50}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="band">
  <div class="band-in">
    <div class="brand"><b>SUSTRA</b><span>AL KHUZAM · Delivery Tracker<i class="ar" style="font-style:normal">متابعة تسليمات مشروع الخزام</i></span></div>
    <nav class="views" id="views" aria-label="View"></nav>
    <div class="band-tools"><span class="asof num" id="asof"></span><div class="conn" id="conn"><i></i><span>Connecting…</span></div></div>
  </div>
</header>
<div id="notice" aria-live="polite"></div>
<main class="wrap" id="app"></main>
<input type="file" id="xlsIn" accept=".xlsx,.xls,.xlsm" hidden>
<div id="layer"></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
const MODS=["M1","M2","M3"];
const BLD=["Z","A","B"];
const LEVELS=["GROUND","FIRST","SECOND","THIRD","FOURTH","FIFTH","SIXTH","SEVENTH","EIGHTH","ROOF","TOP ROOF"];
const ELS=["SOG","SLAB","COLUMNS & SHEAR WALLS","COREWALL","BEAMS","STAIRS","POOL"];
const PK={CONC:"Concrete",RFT:"Reinforcement"};
const PKC={CONC:"CONC",RFT:"RFT"};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAR=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const DAYL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const ST={late:"Overdue",soon:"Due ≤ 3 days",week:"This week",later:"Upcoming",done:"Delivered"};
const ST_AR={late:"متأخر",soon:"خلال 3 أيام",week:"الأسبوع ده",later:"قادم",done:"اتسلّم"};
const PK_AR={CONC:"خرسانة",RFT:"تسليح"};
const bi=(en,ar)=>en+'<span class="ar" lang="ar">'+ar+'</span>';
const daysAr=n=>n===1?"يوم":n===2?"يومين":(n<=10?n+" أيام":n+" يوم");
const SCLS={late:"bad",soon:"warn",week:"info",later:"idle",done:"ok"};

const S={sched:{},status:{},db:null,canWrite:null,ready:false,conn:"wait",view:{screen:"home",mod:null,b:null,filter:"all"}};
try{const v=JSON.parse(localStorage.getItem("khz-view")||"null");if(v&&v.screen)Object.assign(S.view,v)}catch(e){}

const $=s=>document.querySelector(s);
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function P(s){const [y,m,d]=s.split("-").map(Number);return {y,m,d,t:Date.UTC(y,m-1,d)}}
function diffDays(iso){return Math.round((P(iso).t-P(todayISO()).t)/864e5)}
function wd(iso){return new Date(P(iso).t).getUTCDay()}
function fmt(iso,opt){const p=P(iso);let s=pad(p.d)+" "+MON[p.m-1];if(opt==="day")s=DAY[wd(iso)]+" "+s;if(opt==="full")s=DAYL[wd(iso)]+", "+s+" "+p.y;return s}
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const key=it=>it.mod+"-"+it.id;
function isDone(it){const x=S.status[key(it)];return !!(x&&x.done)}
function status(it){if(isDone(it))return "done";const n=diffDays(it.due);return n<0?"late":n<=3?"soon":n<=7?"week":"later"}
function countdown(it){
  if(isDone(it)){const x=S.status[key(it)];return x.doneAt?"Delivered "+fmt(x.doneAt):"Delivered"}
  const n=diffDays(it.due);
  if(n<0)return plural(-n,"day")+" overdue";if(n===0)return "Due today";if(n===1)return "Due tomorrow";return plural(n,"day")+" left";
}
function countdownAr(it){
  if(isDone(it))return "اتسلّم";
  const n=diffDays(it.due);
  if(n<0)return "متأخر "+daysAr(-n);if(n===0)return "النهارده";if(n===1)return "بكرة";return "باقي "+daysAr(n);
}
const cdBi=it=>bi(countdown(it),countdownAr(it));
function dwgs(it){const x=S.status[key(it)];return x&&typeof x.dwgs==="number"?x.dwgs:it.dwgs}
function itemsOf(mod){const s=S.sched[mod];return s&&Array.isArray(s.items)?s.items.map(i=>Object.assign({mod},i)):[]}
function allItems(){return MODS.flatMap(itemsOf)}
function refsOf(mod){const s=S.sched[mod];return s&&s.refs&&typeof s.refs==="object"?s.refs:{}}
function bItems(mod,b){const ref=refsOf(mod)[b];return ref&&ref!==mod?itemsOf(ref).filter(i=>i.b===b):itemsOf(mod).filter(i=>i.b===b)}
const refTag=(mod,b)=>{const ref=refsOf(mod)[b];return ref?`<span class="pill info">${bi("REF · "+modName(ref),"نفس "+modAr(ref))}</span>`:""};
function stats(list){
  const o={total:list.length,done:0,late:0,soon:0,week:0,later:0,dw:0,dwDone:0,next:null};
  for(const it of list){const s=status(it);o[s]++;const d=dwgs(it)||0;o.dw+=d;if(s==="done")o.dwDone+=d;
    if(s!=="done"&&s!=="late"&&(!o.next||it.due<o.next.due))o.next=it}
  return o;
}
const pct=(a,b)=>b?Math.round(a/b*100):0;
const modName=m=>"Module "+m.slice(1);
const modAr=m=>"موديول "+m.slice(1);
const elShort=e=>e==="COLUMNS & SHEAR WALLS"?"COLUMNS & S.W.":e;
const meter=(s,big)=>`<div class="meter${big?" big":""}" title="${s.done} delivered · ${s.late} overdue"><i class="m-done" style="width:${pct(s.done,s.total)}%"></i><i class="m-late" style="width:${pct(s.late,s.total)}%"></i></div>`;
const stat=(label,val,unit,sub,cls,kind)=>kind?`<button type="button" class="stat ${cls||""}" data-list="${kind}" title="Show the list"><span class="go">View ›</span><span class="label">${label}</span><b>${val}${unit?`<em>${unit}</em>`:""}</b><small>${sub||"&nbsp;"}</small></button>`:`<div class="stat ${cls||""}"><span class="label">${label}</span><b>${val}${unit?`<em>${unit}</em>`:""}</b><small>${sub||"&nbsp;"}</small></div>`;
function saveView(){try{localStorage.setItem("khz-view",JSON.stringify(S.view))}catch(e){}}
function go(v){Object.assign(S.view,v);saveView();render();window.scrollTo({top:0})}
const ICON_UP='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2.5M4.5 6L8 2.5 11.5 6M2.5 11.5v2h11v-2"/></svg>';

function statStrip(list,scopeTxt){
  const s=stats(list);
  return `<section class="stats" aria-label="Summary">
    ${stat(bi("Packages","البنود"),s.total,"",scopeTxt,"","all")}
    ${stat(bi("Delivered","اتسلّم"),s.done,"",pct(s.done,s.total)+"% of packages","okv","done")}
    ${stat(bi("Overdue","متأخر"),s.late,"","past target, not delivered",s.late?"alert":"","late")}
    ${stat(bi("Due in 7 days","خلال 7 أيام"),s.soon+s.week,"",s.soon+" within 3 days",s.soon?"warnv":"","week")}
    ${stat(bi("Drawings","اللوحات"),s.dwDone,"/ "+s.dw,"delivered / expected")}
  </section>`;
}

/* ---------- OVERVIEW ---------- */
function renderHome(){
  const all=allItems();const st=stats(all);
  let html=`<div class="mhead"><div><h1>${bi("All modules","كل الموديولات")}</h1><p>${S.ready?(st.next?"Next delivery: <b>"+fmt(st.next.due,"full")+"</b> · "+modName(st.next.mod)+" · Building "+st.next.b+" · "+h(st.next.l)+" "+h(elShort(st.next.e))+" ("+PK[st.next.p]+")":(all.length?"No upcoming deliveries left.":"No schedules uploaded yet.")):"Loading the schedule…"}</p></div></div>`;
  if(!S.ready){return html+`<div class="empty"><p>${S.conn==="off"?(S.connErr||"The schedule could not be loaded."):"Loading…"}</p></div>`}
  html+=statStrip(all,MODS.filter(m=>itemsOf(m).length).length+" of 3 modules loaded");
  const due=all.filter(it=>["late","soon","week"].includes(status(it))).sort((a,b)=>a.due.localeCompare(b.due)||a.mod.localeCompare(b.mod)||BLD.indexOf(a.b)-BLD.indexOf(b.b));
  html+=`<section><div class="sec-head"><h2>${bi("Due now","عليه الدور")}</h2><p>${bi("Overdue packages plus everything due in the next 7 days, across all modules","المتأخر + كل اللي ميعاده خلال 7 أيام في كل الموديولات")}</p></div>`;
  html+=due.length?logTable(due):`<div class="empty"><p>Nothing overdue and nothing due this week.${st.next?" Next delivery is "+fmt(st.next.due,"full")+".":""}</p></div>`;
  html+=`</section><section><div class="sec-head"><h2>${bi("Modules","الموديولات")}</h2><p>${bi("Open a module to see buildings Z · A · B","افتح الموديول عشان تشوف المباني Z · A · B")}</p></div><div class="pgrid">`;
  for(const m of MODS){
    const list=itemsOf(m);
    if(!list.length){html+=`<button type="button" class="panel nodata" data-go="${m}"><div class="card-top"><h3 class="proj-t">${bi(modName(m).toUpperCase(),modAr(m))}</h3><div class="bl-mini">${BLD.map(b=>`<span class="code${refsOf(m)[b]?" ref":""}" title="${refsOf(m)[b]?"Reference of "+modName(refsOf(m)[b]):""}">${b}</span>`).join("")}</div></div><p class="muted" style="margin:0">${bi("No schedule yet. Open the module and upload its Excel timeline.","لسه مفيش جدول — افتح الموديول وارفع شيت الإكسيل")}</p></button>`;continue}
    const s=stats(list);
    html+=`<button type="button" class="panel" data-go="${m}">
      <div class="card-top"><h3 class="proj-t">${bi(modName(m).toUpperCase(),modAr(m))}</h3><div class="bl-mini">${BLD.map(b=>`<span class="code${refsOf(m)[b]?" ref":""}" title="${refsOf(m)[b]?"Reference of "+modName(refsOf(m)[b]):""}">${b}</span>`).join("")}</div></div>
      <div class="prog"><div class="prog-top"><span class="label">${bi("Delivered","اتسلّم")}</span><span class="prog-pct num">${pct(s.done,s.total)}%</span></div>${meter(s,true)}</div>
      <div class="kpis"><div class="kpi"><span>${bi("Packages","البنود")}</span><b>${s.done}/${s.total}</b></div><div class="kpi${s.late?" alert":""}"><span>${bi("Overdue","متأخر")}</span><b>${s.late}</b></div><div class="kpi"><span>${bi("Drawings","اللوحات")}</span><b>${s.dwDone}/${s.dw}</b></div></div>
      ${Object.keys(refsOf(m)).length?`<p class="muted" style="margin:0;font-size:12.5px">${bi("Own scope: Building "+[...new Set(list.map(i=>i.b))].join(", ")+" · "+Object.keys(refsOf(m)).join(" & ")+" = reference of "+modName(Object.values(refsOf(m))[0]),"المبنى "+[...new Set(list.map(i=>i.b))].join("، ")+" خاص بالموديول · "+Object.keys(refsOf(m)).join(" و ")+" نفس "+modAr(Object.values(refsOf(m))[0]))}</p>`:""}
      <div class="nextline"><span class="plabel">${bi("Next delivery","أقرب تسليم")}</span>${s.next?`<span><b class="num">${fmt(s.next.due,"day")}</b> · ${s.next.b} · ${h(s.next.l)} ${h(elShort(s.next.e))} <span class="code">${PKC[s.next.p]}</span></span>`:`<span>${s.done===s.total?bi("All delivered","كله اتسلّم"):"—"}</span>`}</div>
    </button>`;
  }
  return html+`</div></section>`;
}
function logTable(list){
  let prev=null;
  const rows=list.map(it=>{const s=status(it);const d=dwgs(it);const br=prev!==null&&prev!==it.due;prev=it.due;
    return `<tr class="${s==="late"?"is-late ":""}${br?"daybreak":""}">
      <td class="nowrap num"><b>${fmt(it.due)}</b><span class="sub">${DAYL[wd(it.due)]} · ${DAR[wd(it.due)]}</span></td>
      <td class="nowrap"><span class="tag">${bi(modName(it.mod).toUpperCase(),modAr(it.mod))}</span></td>
      <td class="nowrap"><span class="code">${it.b}</span></td>
      <td class="nowrap"><b>${h(it.l)}</b></td>
      <td>${h(it.e)}</td>
      <td class="nowrap"><span class="code">${bi(PKC[it.p],PK_AR[it.p])}</span></td>
      <td class="r num">${d??"—"}</td>
      <td class="nowrap"><span class="pill ${SCLS[s]}">${cdBi(it)}</span></td>
      <td class="r"><button type="button" class="btn small bi" data-open="${h(key(it))}">${S.canWrite===false?bi("View","عرض"):bi("Update","تحديث")}</button></td></tr>`}).join("");
  return `<div class="tablewrap"><table class="log"><thead><tr><th>${bi("Target date","ميعاد التسليم")}</th><th>${bi("Module","الموديول")}</th><th>${bi("Bldg","المبنى")}</th><th>${bi("Level","الدور")}</th><th>${bi("Element","العنصر")}</th><th>${bi("Package","النوع")}</th><th class="r">${bi("Dwgs","لوحات")}</th><th>${bi("Status","الحالة")}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- MODULE ---------- */
function renderModule(){
  const m=S.view.mod;const list=itemsOf(m);const sch=S.sched[m];
  let html=`<div class="mhead"><div><h1>${bi(modName(m),modAr(m))}</h1><p>${sch&&sch.source?"Source: "+h(sch.source)+(sch.importedAt?" · uploaded "+fmt(sch.importedAt.slice(0,10)):""):(S.ready?"No schedule uploaded for this module yet.":"Loading…")}</p></div>
    ${S.canWrite!==false&&S.ready?`<button type="button" class="btn${list.length?"":" primary"}" data-import>${ICON_UP}<span>${list.length?bi("Replace schedule (Excel)","تحديث الجدول من الإكسيل"):bi("Upload schedule (Excel)","رفع شيت المواعيد")}</span></button>`:""}</div>`;
  if(!list.length)return html+`<div class="empty"><p>Upload the Excel timeline for ${modName(m)}. Use the same layout as the TIMELINE sheet: levels × elements, with Concrete Dimensions and Reinforcement columns per building. Drawing counts are picked up from a sheet with an EXP. NO. DWGS column.<span class="ar" lang="ar">ارفع شيت الإكسيل بنفس شكل شيت الـ TIMELINE (الأدوار × العناصر، ولكل مبنى خرسانة وتسليح) وهيتقرا تلقائي.</span></p></div>`;
  html+=statStrip(list,"Building "+[...new Set(list.map(i=>i.b))].join(" · ")+(Object.keys(refsOf(m)).length?" (own scope)":""));
  const refs=refsOf(m);const blds=BLD.filter(b=>list.some(i=>i.b===b)||refs[b]).concat([...new Set(list.map(i=>i.b))].filter(b=>!BLD.includes(b)));
  if(!S.view.b||!blds.includes(S.view.b))S.view.b=blds[0];
  html+=`<section><div class="sec-head"><h2>${bi("Buildings","المباني")}</h2><p>${bi("Select a building to see its levels","اختار المبنى عشان تشوف أدواره")}</p></div><div class="bgrid">`;
  for(const b of blds){
    const bl=bItems(m,b);const s=stats(bl);const lv=LEVELS.filter(l=>bl.some(i=>i.l===l));
    html+=`<button type="button" class="bcard" data-b="${b}" aria-pressed="${S.view.b===b}">
      <div class="bhead"><span class="bletter">${b}</span><div><b>${bi("BUILDING "+b,"مبنى "+b)}</b><span>${plural(lv.length,"level")} · ${h(lv[0]||"")} → ${h(lv[lv.length-1]||"")}</span></div></div>${refTag(m,b)}
      <div class="prog"><div class="prog-top"><span class="label">${bi("Delivered","اتسلّم")}</span><span class="num"><b>${pct(s.done,s.total)}%</b></span></div>${meter(s)}</div>
      <div class="kpis"><div class="kpi"><span>${bi("Packages","البنود")}</span><b>${s.done}/${s.total}</b></div><div class="kpi${s.late?" alert":""}"><span>${bi("Overdue","متأخر")}</span><b>${s.late}</b></div><div class="kpi"><span>${bi("Drawings","اللوحات")}</span><b>${s.dwDone}/${s.dw}</b></div></div>
      <div class="nextline"><span class="plabel">${bi("Next","أقرب تسليم")}</span>${s.next?`<span><b class="num">${fmt(s.next.due,"day")}</b> · ${h(s.next.l)} ${h(elShort(s.next.e))} <span class="code">${PKC[s.next.p]}</span></span>`:`<span>${s.done===s.total?bi("All delivered","كله اتسلّم"):"—"}</span>`}</div>
    </button>`;
  }
  html+=`</div></section>`;
  const bl=bItems(m,S.view.b);const refM=refs[S.view.b];
  const inF=(it,f)=>{const s=status(it);return f==="all"||(f==="soon"?(s==="soon"||s==="week"):s===f)};
  const F=[["all",bi("All","الكل")],["late",bi("Overdue","متأخر")],["soon",bi("Due in 7 days","خلال 7 أيام")],["later",bi("Upcoming","قادم")],["done",bi("Delivered","اتسلّم")]];
  html+=`<section id="matrix"><div class="sec-head"><h2>${bi("Building "+S.view.b+" · Levels &amp; elements","مبنى "+S.view.b+" · الأدوار والعناصر")}</h2><p>${bi("Click any package to mark it delivered or set its drawing count","اضغط على أي خانة عشان تعلّمها اتسلّمت أو تعدّل عدد اللوحات")}</p></div>
    ${refM?`<div class="refnote"><span>${bi("Building "+S.view.b+" is a reference of "+modName(refM)+" — same drawings and dates. Deliveries marked here update "+modName(refM)+" too.","مبنى "+S.view.b+" نفس "+modAr(refM)+" بالظبط — نفس اللوحات والمواعيد، وأي تسليم تعلّمه هنا بيتعلّم في "+modAr(refM)+".")}</span><button type="button" class="btn small bi" data-go="${refM}">${bi("Open "+modName(refM),"افتح "+modAr(refM))}</button></div>`:""}
    <div class="fbar"><span class="label">${bi("Show","عرض")}</span><div class="seg" role="group" aria-label="Filter">${F.map(([k,t])=>`<button type="button" data-f="${k}" aria-pressed="${S.view.filter===k}">${t}<small>${bl.filter(i=>inF(i,k)).length}</small></button>`).join("")}</div>
    <div class="legend">${["late","soon","week","later","done"].map(k=>`<span><i class="dot ${SCLS[k]}"></i><span>${bi(ST[k],ST_AR[k])}</span></span>`).join("")}</div></div></section>`;
  const lvls=LEVELS.filter(l=>bl.some(i=>i.l===l)).concat([...new Set(bl.map(i=>i.l))].filter(l=>!LEVELS.includes(l)));
  let body="";
  for(const l of lvls){
    const li=bl.filter(i=>i.l===l);const s=stats(li);
    const els=ELS.filter(e=>li.some(i=>i.e===e)).concat([...new Set(li.map(i=>i.e))].filter(e=>!ELS.includes(e)));
    const rows=els.map(e=>{const c=li.find(i=>i.e===e&&i.p==="CONC"),r=li.find(i=>i.e===e&&i.p==="RFT");
      const f=S.view.filter;if(!((c&&inF(c,f))||(r&&inF(r,f))))return "";
      return `<tr><td class="el">${h(e)}</td><td class="cellw">${cellHtml(c,f,inF)}</td><td class="cellw">${cellHtml(r,f,inF)}</td></tr>`}).join("");
    if(!rows)continue;
    const dates=li.map(i=>i.due).sort();
    body+=`<tr class="lvl"><td colspan="3"><div class="lvl-in"><h3>${h(l)}${s.late?` <span class="pill bad">${bi(s.late+" overdue",s.late+" متأخر")}</span>`:""}</h3><div class="lvl-meta"><span class="num">${fmt(dates[0])} → ${fmt(dates[dates.length-1])}</span><span class="num">${s.done}/${s.total} delivered</span><span class="num">${s.dw} dwgs</span>${meter(s)}</div></div></td></tr>${rows}`;
  }
  html+=body?`<div class="tablewrap" style="margin-top:-10px"><table class="mx"><colgroup><col class="c-el"><col><col></colgroup><thead><tr><th>${bi("Element","العنصر")}</th><th>${bi("Concrete","خرسانة")}<small>Concrete dimensions</small></th><th>${bi("Reinforcement","تسليح")}<small>RFT detailing</small></th></tr></thead><tbody>${body}</tbody></table></div>`:`<div class="empty"><p>No packages match this filter.</p></div>`;
  return html;
}
function cellHtml(it,f,inF){
  if(!it)return `<span class="na">— not in scope<span class="ar">خارج النطاق</span></span>`;
  if(!inF(it,f))return `<span class="na">&nbsp;</span>`;
  const s=status(it);const d=dwgs(it);
  return `<button type="button" class="cell ${s}" data-pk="${PKC[it.p]} · ${PK_AR[it.p]}" data-open="${h(key(it))}" aria-label="${h(it.l+" "+it.e+" "+PK[it.p])}">
    <span class="l1"><span class="dt">${fmt(it.due,"day")}</span><span class="pill ${SCLS[s]}">${bi(ST[s],ST_AR[s])}</span></span>
    <span class="l2"><span class="cd">${cdBi(it)}</span><span class="num">${d!=null?plural(d,"dwg"):"— dwgs"}</span></span></button>`;
}

/* ---------- DIALOGS ---------- */
let onSave=null;

function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
//PARSER-START
function parseWorkbook(XLSX,wb){
  const LV={GEOUND:"GROUND","GRAOUND":"GROUND"};
  const iso=(y,m,d)=>(m>=1&&m<=12&&d>=1&&d<=31)?y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"):null;
  const cell=(ws,r,c)=>ws[XLSX.utils.encode_cell({r:r-1,c:c-1})];
  const txt=x=>x&&x.v!=null?String(x.v).trim():"";
  function walk(ws){
    if(!ws||!ws["!ref"])return null;
    const ref=XLSX.utils.decode_range(ws["!ref"]);const maxR=ref.e.r+1,maxC=ref.e.c+1;
    const cols=[];let cur=null;
    for(let c=3;c<=maxC;c+=2){
      const hd=txt(cell(ws,1,c));
      if(/BUILDING|BLDG|مبنى/i.test(hd)){const m=hd.match(/\(\s*([A-Z0-9]+)\s*\)/i)||hd.match(/(?:BUILDING|BLDG)\s*([A-Z0-9]+)/i);cur=m?m[1].toUpperCase():hd}
      if(!cur)continue;
      const pk=txt(cell(ws,2,c));if(!pk)continue;
      cols.push({c,b:cur,p:/REINF|RFT|تسليح/i.test(pk)?"RFT":"CONC",sub:txt(cell(ws,3,c+1))});
    }
    if(!cols.length)return null;
    const rows=[];let lvl=null;
    for(let r=4;r<=maxR;r++){
      const a=txt(cell(ws,r,1));if(a)lvl=LV[a.toUpperCase()]||a.toUpperCase();
      const el=txt(cell(ws,r,2));if(!el||!lvl)continue;
      for(const k of cols)rows.push({b:k.b,l:lvl,e:el.toUpperCase().replace(/\s+/g," "),p:k.p,dc:cell(ws,r,k.c),sc:cell(ws,r,k.c+1),sub:k.sub});
    }
    return rows;
  }
  const sheets=wb.SheetNames.map(n=>({n,rows:walk(wb.Sheets[n])})).filter(s=>s.rows);
  if(!sheets.length)throw new Error("format");
  const textDate=x=>x&&x.t==="s"&&/^\s*\d{1,2}\/\d{1,2}\/\d{4}/.test(x.v);
  const isDate=x=>x&&((x.t==="n"&&x.v>30000&&x.v<80000)||x.t==="d"||textDate(x));
  const score=s=>s.rows.filter(r=>isDate(r.dc)).length+(/TIMELINE|SCHEDULE/i.test(s.n)?1000:0);
  const dsh=sheets.slice().sort((a,b)=>score(b)-score(a))[0];
  // Excel misread dd/mm as mm/dd whenever the sheet also holds text dates like 25/10/2026
  const swap=dsh.rows.some(r=>textDate(r.dc)&&+r.dc.v.match(/^\s*(\d{1,2})/)[1]>12);
  function toISO(x){
    if(!x)return null;
    if(x.t==="n"){const d=XLSX.SSF.parse_date_code(x.v);if(!d)return null;return (swap&&d.d<=12)?iso(d.y,d.d,d.m):iso(d.y,d.m,d.d)}
    if(x.t==="d"){const d=new Date(x.v);return iso(d.getFullYear(),d.getMonth()+1,d.getDate())}
    if(x.t==="s"){const m=x.v.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return iso(+m[3],+m[2],+m[1]);const m2=x.v.match(/(\d{4})-(\d{2})-(\d{2})/);if(m2)return iso(+m2[1],+m2[2],+m2[3])}
    return null;
  }
  const k4=r=>r.b+"|"+r.l+"|"+r.e+"|"+r.p;
  const counts={};
  for(const s of sheets)for(const r of s.rows){if(/NO|DWG|عدد/i.test(r.sub)&&r.sc&&r.sc.t==="n"&&r.sc.v>=0&&r.sc.v<1000)counts[k4(r)]=r.sc.v}
  const items=[];const seen=new Set();
  for(const r of dsh.rows){
    const due=toISO(r.dc);if(!due)continue;
    const id=r.b+"-"+r.l.replace(/ /g,"_")+"-"+r.e.split(/\s/)[0].replace(/&/g,"")+"-"+r.p;
    if(seen.has(id))continue;seen.add(id);
    let dw=counts[k4(r)];if(dw==null&&r.sc&&r.sc.t==="n"&&/NO|DWG/i.test(r.sub))dw=r.sc.v;
    const note=(/NOTE|ملاحظ/i.test(r.sub)&&r.sc&&r.sc.t==="s")?String(r.sc.v).trim():"";
    items.push({id,b:r.b,l:r.l,e:r.e,p:r.p,due,dwgs:dw==null?null:dw,note});
  }
  return {items,sheet:dsh.n,swapped:swap};
}
//PARSER-END
async function importFile(file){
  let XLSX;try{XLSX=await loadXLSX()}catch(e){toast("Couldn't load the Excel reader. Try again.");return}
  let res;
  try{res=parseWorkbook(XLSX,XLSX.read(await file.arrayBuffer(),{type:"array"}))}catch(e){toast("This file isn't in the expected timeline layout.");return}
  if(!res.items.length){toast("No target dates found in this file.");return}
  const it=res.items;const dates=it.map(i=>i.due).sort();const bl=[...new Set(it.map(i=>i.b))];
  const target=S.view.mod||"M1";
  layer(`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="impT">
    <div class="dlg-h"><small>EXCEL TIMELINE</small><h3 id="impT">${bi("Review before saving","مراجعة قبل الحفظ")}</h3></div>
    <div class="dlg-b">
      <div class="field full"><span>${bi("File","الملف")}</span><output>${h(file.name)}</output></div>
      <div class="field"><span>${bi("Dates read from sheet","شيت المواعيد")}</span><output>${h(res.sheet)}</output></div>
      <div class="field"><span>${bi("Packages","البنود")}</span><output class="num">${it.length}</output></div>
      <div class="field"><span>${bi("Buildings","المباني")}</span><output>${bl.join(" · ")}</output></div>
      <div class="field"><span>${bi("Date range","الفترة")}</span><output class="num">${fmt(dates[0])} → ${fmt(dates[dates.length-1])}</output></div>
      <div class="field"><span>${bi("With drawing counts","بنود بعدد لوحات")}</span><output class="num">${it.filter(i=>i.dwgs!=null).length}</output></div>
      <label class="field"><span>${bi("Save to","احفظه في")}</span><select id="impMod">${MODS.map(m=>`<option value="${m}"${m===target?" selected":""}>${modName(m)}${itemsOf(m).length?" (replaces current)":""}</option>`).join("")}</select></label>
      <p class="muted full" style="margin:0;font-size:12.5px">Packages already marked delivered keep their status when you replace a schedule.<span class="ar">البنود اللي اتعلّمت إنها اتسلّمت هتفضل زي ما هي.</span></p>
    </div>
    <div class="dlg-f"><p class="err" id="dlgErr" role="alert"></p><button type="button" class="btn bi" data-close>${bi("Cancel","إلغاء")}</button><button type="button" class="btn primary bi" data-save="imp">${bi("Save schedule","حفظ الجدول")}</button></div></div>`,async()=>{
      const m=$("#impMod").value;
      try{await S.db.collection("schedules").doc(m).set(Object.assign({module:m,source:file.name,sheet:res.sheet,importedAt:new Date().toISOString(),items:it},(()=>{const old=refsOf(m),keep={};for(const b in old)if(!it.some(i=>i.b===b))keep[b]=old[b];return Object.keys(keep).length?{refs:keep}:{}})()));closeLayer();toast(modName(m)+" schedule saved");go({screen:"mod",mod:m,filter:"all"})}
      catch(e){$("#dlgErr").textContent=e&&e.code==="invalid_argument"?"You don't have permission to upload schedules.":"Not saved. Try again."}
    });
}

const ICON_BELL='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5V7a4 4 0 018 0v4.5l1.2 1.3H2.8zM6.5 14a1.6 1.6 0 003 0"/></svg>';
function noticeKey(){return "khz-notice-off-"+todayISO()}
function renderNotice(){
  const host=$("#notice");if(!host)return;
  if(!S.ready){host.innerHTML="";return}
  let off=false;try{off=localStorage.getItem(noticeKey())==="1"}catch(e){}
  const today=allItems().filter(LISTS.today.f).sort((a,b)=>a.mod.localeCompare(b.mod)||BLD.indexOf(a.b)-BLD.indexOf(b.b));
  const late=allItems().filter(LISTS.late.f);
  if(off||(!today.length&&!late.length)){host.innerHTML="";return}
  const dw=today.reduce((a,i)=>a+(dwgs(i)||0),0);
  const alertBtn=(typeof SYS_NOTIFY!=="undefined"&&SYS_NOTIFY&&"Notification" in window&&Notification.permission==="default")?`<button type="button" class="btn small bi" data-sysnotif>${bi("Desktop alerts","تنبيهات على الجهاز")}</button>`:"";
  const lateBtn=late.length?`<button type="button" class="btn small bi danger" data-list="late">${bi(late.length+" overdue · View",late.length+" متأخر · عرض")}</button>`:"";
  if(!today.length){
    host.innerHTML=`<div class="nbar lateonly" role="status"><div class="nb-in"><span class="nb-ic">${ICON_BELL}</span>
      <div class="nb-t"><b>${bi(plural(late.length,"overdue package"),late.length+" بند متأخر")}</b><span>${bi("Past target date and not marked delivered","عدّى ميعادهم ولسه ما اتعلّموش إنهم اتسلّموا")}</span></div>
      <div class="nb-act">${lateBtn}${alertBtn}<button type="button" class="nb-x" data-dismiss aria-label="Hide for today">×</button></div></div></div>`;return}
  host.innerHTML=`<div class="nbar" role="status"><div class="nb-in"><span class="nb-ic">${ICON_BELL}</span>
    <div><div class="nb-t"><b>${bi("Delivery due today","عليك تسليم النهارده")}</b><span class="num">${bi(plural(today.length,"package")+" · "+plural(dw,"drawing"),today.length+" بند · "+dw+" لوحة")}</span></div>
    <ul class="nb-list">${today.map(it=>{const d=dwgs(it);return `<li><span class="tag">${bi(modName(it.mod).toUpperCase(),modAr(it.mod))}</span><span class="code">${bi(it.b,"مبنى")}</span><span class="w">${h(it.l)} · ${h(it.e)}</span><span class="code">${bi(PKC[it.p],PK_AR[it.p])}</span><span class="num"><b>${d??"—"}</b> ${bi("dwgs","لوحة")}</span>${S.canWrite!==false&&S.db?`<button type="button" class="btn small bi" data-open="${h(key(it))}">${bi("Mark delivered","تم التسليم")}</button>`:""}</li>`}).join("")}</ul></div>
    <div class="nb-act">${lateBtn}${alertBtn}<button type="button" class="nb-x" data-dismiss aria-label="Hide for today">×</button></div></div></div>`;
}
function sysNotify(){
  if(typeof SYS_NOTIFY==="undefined"||!SYS_NOTIFY||!("Notification" in window)||Notification.permission!=="granted"||!S.ready)return;
  const t=allItems().filter(LISTS.today.f);if(!t.length)return;
  const k="khz-notified-"+todayISO()+"-"+t.length;try{if(localStorage.getItem(k))return;localStorage.setItem(k,"1")}catch(e){}
  const dw=t.reduce((a,i)=>a+(dwgs(i)||0),0);
  try{new Notification("KHUZAM · "+plural(t.length,"delivery")+" due today",{body:t.map(i=>modName(i.mod)+" · "+i.b+" · "+i.l+" "+elShort(i.e)+" "+PKC[i.p]+(dwgs(i)?" · "+dwgs(i)+" dwgs":"")).join("\n")+"\nTotal: "+dw+" drawings",tag:"khuzam-today"})}catch(e){}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-scrim]");if(!t)return;
  if(t.matches("[data-scrim]")){if(e.target===t)closeLayer();return}
  if(t.dataset.go)return go({screen:"mod",mod:t.dataset.go,filter:"all"});
  if(t.hasAttribute("data-home"))return go({screen:"home"});
  if(t.dataset.b){S.view.b=t.dataset.b;saveView();render();const m=$("#matrix");m&&m.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(t.dataset.f){S.view.filter=t.dataset.f;saveView();render();return}
  if(t.dataset.open)return openItem(t.dataset.open);
  if(t.dataset.list)return openList(t.dataset.list);
  if(t.hasAttribute("data-dismiss")){try{localStorage.setItem(noticeKey(),"1")}catch(x){}$("#notice").innerHTML="";return}
  if(t.hasAttribute("data-sysnotif")){try{Notification.requestPermission().then(()=>{render();if(Notification.permission==="granted")toast("Desktop alerts on · التنبيهات اشتغلت")})}catch(x){}return}
  if(t.hasAttribute("data-close"))return closeLayer();
  if(t.dataset.save&&onSave){t.disabled=true;Promise.resolve(onSave(t)).finally(()=>{t.disabled=false});return}
  if(t.hasAttribute("data-import")){if(!S.db){toast("Uploading isn't available in this view.");return}$("#xlsIn").value="";$("#xlsIn").click()}
});
